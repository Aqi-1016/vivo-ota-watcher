name: Vivo OTA Daily Check

on:
  schedule:
    # 每天北京时间 09:00 / 19:00 / 22:00（UTC+8，对应 UTC 01:00 / 11:00 / 14:00）
    - cron: '0 1,11,14 * * *'
    # 每天北京时间 20:30（UTC 12:30）
    - cron: '30 12 * * *'
  workflow_dispatch: {}   # 支持手动触发测试

permissions:
  contents: write        # 提交 results/ 回仓库
  issues: write          # 发现新版本时创建/更新通知 Issue

concurrency:
  group: ota-daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
           repository: Aqi-1016/vivo-ota-watcher
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt

      # 纯 Python 方案：AES 加密已静态实现（密钥自 libvivoseckey.so 逆向提取），
      # 无需 JDK / unidbg / Maven。查询引擎见 vivo_ota_tracker.py。
      - name: Run OTA check
        id: check
        run: python run_check.py

      - name: Commit results
        # 全部机型都是 no_update 时跳过提交（文件内容只有时间戳变化）
        if: always() && steps.check.outputs.all_no_update != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "chore: update OTA check results $(date +%F)"
            git push
          fi

      - name: Report new versions via Issue
        if: always() && steps.check.outputs.has_new_versions == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="vivo OTA 新版本汇总"
          NUMBER=$(gh issue list --state all --search "in:title $TITLE" --limit 1 --json number --jq '.[0].number // empty')
          # 指纹行（机型:版本 列表）：同一批版本只通知一次，同天内出现新版本仍能通知
          FP=$(head -n 1 issue_body.md)
          if [ -n "$NUMBER" ]; then
            gh issue reopen "$NUMBER" 2>/dev/null || true
            EXISTING=$(gh issue view "$NUMBER" --json body,comments --jq '[.body] + [.comments[].body] | join("\n")')
            if printf '%s' "$EXISTING" | grep -qF "$FP"; then
              echo "Same versions already reported, skip"
            else
              gh issue comment "$NUMBER" --body-file issue_body.md
            fi
          else
            gh issue create --title "$TITLE" --body-file issue_body.md
          fi
